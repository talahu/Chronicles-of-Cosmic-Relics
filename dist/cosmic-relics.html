<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1c">
<title>Chronicles of Cosmic Relics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
 --space:#070b1c; --space-2:#10173a;
 --panel:#eef1f7; --panel-2:#e1e6f0; --ink:#151c33; --muted:#56607a; --line:rgba(21,28,51,.16);
 --beacon:#f4b63f; --beacon-ink:#8a5800; --signal:#0d7891; --signal-bright:#5fd0e6;
 --ok:#1b7d52; --bad:#b8352a; --wire-on:#2bb7d6; --wire-off:#b9c0cf; --gate:#ffffff;
 --hud:rgba(8,12,30,.74); --hud-ink:#e8ecf6; --hud-muted:#a3adc6;
 --f-display:"Chakra Petch","Be Vietnam Pro",system-ui,sans-serif;
 --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 color-scheme:light;
 box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
 --panel:#141a33; --panel-2:#1c2445; --ink:#e8ecf6; --muted:#a3adc6; --line:rgba(232,236,246,.14);
 --beacon-ink:#f4c364; --signal:#5fd0e6; --ok:#4cc38a; --bad:#ff8172; --wire-on:#5fd0e6; --wire-off:#3a4366; --gate:#1c2445; color-scheme:dark; } }
:root[data-theme="dark"]{ --panel:#141a33; --panel-2:#1c2445; --ink:#e8ecf6; --muted:#a3adc6; --line:rgba(232,236,246,.14);
 --beacon-ink:#f4c364; --signal:#5fd0e6; --ok:#4cc38a; --bad:#ff8172; --wire-on:#5fd0e6; --wire-off:#3a4366; --gate:#1c2445; color-scheme:dark; }
html{height:100%;background:var(--space);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--space);color:var(--hud-ink);font:400 16px/1.55 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--signal-bright);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#stars{position:absolute;inset:0;width:100%;height:100%}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}

/* buttons */
.btn{border:1px solid var(--line);background:transparent;border-radius:12px;padding:.7em 1.15em;font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.01em;color:var(--ink);min-height:44px;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--beacon);border-color:var(--beacon);color:#231500}
.btn.primary:hover{background:#ffc75c}
.btn.ghost{color:var(--muted)}
.btn.sm{min-height:34px;padding:.35em .8em;font-size:.88rem}
.btn.round{width:48px;height:48px;padding:0;border-radius:50%;flex:none}
.btn.glow{box-shadow:0 0 0 0 rgba(244,182,63,.7);animation:ring 1.8s infinite}
@keyframes ring{70%{box-shadow:0 0 0 14px rgba(244,182,63,0)}100%{box-shadow:0 0 0 0 rgba(244,182,63,0)}}
.hudbtn{border:1px solid rgba(255,255,255,.14);background:var(--hud);color:var(--hud-ink);border-radius:12px;min-height:42px;min-width:42px;padding:0 .8em;font-family:var(--f-display);font-weight:600;font-size:.9rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hudbtn.muted{color:var(--hud-muted);text-decoration:line-through}

/* title */
#scrTitle{align-items:center;justify-content:center;padding:24px clamp(20px,5vw,72px);gap:clamp(16px,4vw,64px)}
.ttext{max-width:34rem;position:relative;z-index:1}
.kicker{font-family:var(--f-display);font-weight:500;color:var(--hud-muted);font-size:.9rem;margin:0 0 1.2rem}
h1.title{font-family:var(--f-display);font-weight:700;font-size:clamp(2.4rem,6.4vw,4.6rem);line-height:.92;letter-spacing:-.02em;margin:0;color:#fff}
h1.title span{display:block}
h1.title span:last-child{color:transparent;-webkit-text-stroke:1.2px #ffe0a0;text-shadow:0 0 28px rgba(244,182,63,.35)}
.sub{font-family:var(--f-display);font-weight:500;font-size:clamp(1.05rem,2.2vw,1.35rem);color:#ffd987;margin:.9rem 0 1.1rem}
.story{color:#c9d0e2;max-width:32rem;margin:0 0 1.6rem;font-size:1rem}
.trow{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.trow .btn:not(.primary){color:var(--hud-ink);border-color:rgba(255,255,255,.2)}
#loading{color:var(--hud-muted);font-size:.9rem;margin-top:.8rem}
.globe-wrap{position:relative;flex:none;width:min(46vh,40vw,420px);aspect-ratio:1}
.globe-wrap canvas{width:100%;height:100%;display:block;border-radius:50%;filter:drop-shadow(0 0 40px rgba(120,150,255,.12))}
.tcorner{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:2}
@media (max-width:760px){ #scrTitle{flex-direction:column;justify-content:flex-start;overflow:auto;padding-top:56px} .globe-wrap{width:min(58vw,260px)} .ttext{text-align:left} }
@media (max-height:500px) and (orientation:landscape){ .globe-wrap{width:min(70vh,260px)} h1.title{font-size:2.2rem} .kicker{padding-right:100px;margin-bottom:.6rem} .story{font-size:.9rem;margin-bottom:1rem} #scrTitle{padding-top:12px} }

/* planets */
#scrPlanets{flex-direction:column;align-items:center;justify-content:safe center;padding:20px;gap:18px;overflow:auto}
#scrPlanets h2{font-family:var(--f-display);font-weight:600;font-size:clamp(1.4rem,3vw,2rem);margin:0;color:#fff}
.pcards{display:flex;gap:clamp(12px,3vw,40px);flex-wrap:wrap;justify-content:center;width:100%;max-width:1200px}
.pcard{flex:1 1 240px;max-width:360px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.6rem;padding:8px}
.pcard canvas{width:min(200px,42vw);aspect-ratio:1;border-radius:50%}
.pcard h3{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:.2rem 0 0;color:#fff}
.pcard p{margin:0;color:#c9d0e2;font-size:.95rem;max-width:30ch}
.pc-bar{width:180px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.pc-bar i{display:block;height:100%;background:var(--beacon);width:0;transition:width .6s}
.pc-prog{font-family:var(--f-display);color:#ffd987;font-size:.9rem}
@media (max-height:520px){ .pcard canvas{width:120px} .pcard p{display:none} }

/* map */
#scrMap{display:none}
#scrMap.on{display:block}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
.hudtop{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.hudtop>*{pointer-events:auto}
#coord{font-family:var(--f-display);font-weight:500;background:var(--hud);border-radius:12px;padding:.55em .9em;font-size:.92rem;color:#bfeaf4;border:1px solid rgba(95,208,230,.25);min-height:42px;display:flex;align-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.spacer{flex:1}
#planetChip{color:#ffd987}
.scanner{position:absolute;left:10px;bottom:12px;background:var(--hud);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:.7em .9em;display:flex;gap:.8em;align-items:center;max-width:min(340px,calc(100% - 20px));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none}
.compass{width:44px;height:44px;border-radius:50%;border:1px solid rgba(95,208,230,.4);display:grid;place-items:center;flex:none}
#arrow{width:26px;height:26px;transition:transform .15s linear}
.scanner small{display:block;color:var(--hud-muted);font-size:.78rem}
#nearName{font-family:var(--f-display);font-weight:600;font-size:1rem;display:block;line-height:1.2}
#nearDist{color:#bfeaf4;font-size:.85rem}
#prog{font-family:var(--f-display);color:#ffd987;font-size:.8rem;display:block;margin-top:.2rem}
#interact{position:absolute;left:50%;bottom:max(14px,calc(12px));transform:translateX(-50%);z-index:3;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#interact.done{background:var(--panel);color:var(--ink);border-color:var(--panel)}
@media (max-width:640px){ #toast{top:112px} #btnSources{display:none} #interact{bottom:96px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #coord{font-size:.8rem;order:9;flex-basis:auto} }
#toast{position:absolute;left:50%;top:64px;transform:translate(-50%,-10px);background:var(--panel);color:var(--ink);padding:.75em 1.1em;border-radius:12px;max-width:min(460px,calc(100% - 24px));font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* overlays */
.overlay{position:absolute;inset:0;z-index:30;background:rgba(3,6,16,.66);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:12px}
.overlay.open{display:flex}
.sheet{background:var(--panel);color:var(--ink);width:min(760px,100%);max-height:100%;overflow:auto;border-radius:20px;padding:clamp(16px,3vw,28px);position:relative;-webkit-user-select:text;user-select:text;box-shadow:0 30px 80px rgba(0,0,0,.5);overscroll-behavior:contain}
.sheet.wide{width:min(980px,100%)}
.x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--panel-2);color:var(--ink);font-size:1.2rem;line-height:1;z-index:2}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,3.5vw,2rem);line-height:1.1;margin:.1rem 0 .4rem}
.sheet h3{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:1.1rem 0 .5rem}
.hint{color:var(--muted);font-size:.93rem;margin:.2rem 0 .8rem}
.actions{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1.2rem;align-items:center}
.log{background:#0a1028;color:#d8def0;border-radius:14px;padding:.9em 1em;font-size:.95rem;margin:0 0 1rem;cursor:pointer;min-height:3em}
.ln{margin:.25em 0 .55em}
.ln b{font-family:var(--f-display);font-weight:600;font-size:.78rem;margin-right:.6em;padding:.12em .5em;border-radius:6px;background:rgba(255,255,255,.08);color:#a3adc6}
.ln.robot b{color:#7fe0f2;background:rgba(95,208,230,.12)} .ln.robot span{color:#bfeaf4}
.ln.relic b{color:#ffd987;background:rgba(244,182,63,.14)} .ln.relic span{color:#ffe7b5;font-style:italic}
.ln.alert b{color:#ffb4a8;background:rgba(255,120,100,.14)}
.ln.ok b{color:#9ff0c6;background:rgba(76,195,138,.15)} .ln.ok span{color:#d7f8e6}
.ln.note{font-size:.84rem;color:#a3adc6;border-left:2px solid rgba(244,182,63,.5);padding-left:.8em}
.dossier{display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:18px;align-items:start;margin-top:.2rem}
.dossier .art{width:100%;height:auto;border-radius:14px;display:block}
.art.sm{width:160px;border-radius:12px;display:block}
.dlg-head{display:flex;justify-content:center;margin-bottom:.8rem}
.tag{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:.8rem;margin:0;color:var(--muted)}
.tag.ok{color:var(--beacon-ink)}
.mission{margin:0 0 .6rem;color:var(--ink)}
dl{display:grid;grid-template-columns:auto 1fr;gap:.25rem .9rem;margin:0;font-size:.92rem}
dt{color:var(--muted)} dd{margin:0}
.facts{margin:0;padding-left:1.1em} .facts li{margin:.35em 0}
@media (max-width:600px){ .dossier{grid-template-columns:1fr} .dossier .art{max-width:300px} }
.meter{display:flex;align-items:center;gap:.7em;flex:1;font-size:.88rem;color:var(--muted)}
.meter .bar{flex:1;height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;min-width:60px}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--signal-bright),var(--beacon));transition:width .15s}
.meter b{color:var(--ink);min-width:3ch;text-align:right}
.dustwrap{position:relative;width:100%;border-radius:14px;overflow:hidden;margin-bottom:.8rem;touch-action:none}
.dustwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.dlayer{cursor:grab}
.dlabel{position:absolute;left:10px;bottom:8px;font-family:var(--f-display);font-size:.75rem;color:rgba(255,255,255,.75);pointer-events:none;text-shadow:0 1px 2px #000}
.antwrap{width:100%;border-radius:14px;overflow:hidden;touch-action:none}
.ant{width:100%;display:block;touch-action:none;cursor:grab}
.antctl{display:flex;align-items:center;gap:.8em;margin-top:.8rem}
.amsg,.cmsg,.qmsg{min-height:1.4em;font-family:var(--f-display);color:var(--signal);margin:.6rem 0 0}
.legend{margin:0 0 .6rem;padding-left:1.1em;font-size:.88rem;color:var(--muted)}
.circ svg{width:100%;height:auto;display:block;max-height:52vh}
.circ .w{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.sw{cursor:pointer} .sw rect{fill:var(--panel-2);stroke:var(--line);stroke-width:1.5} .sw circle{fill:#9aa4bf;transition:cx .15s} .sw text{font-family:var(--f-display);font-weight:700;font-size:15px;text-anchor:middle;fill:var(--muted)}
.sw.on rect{fill:rgba(95,208,230,.22);stroke:var(--wire-on)} .sw.on circle{fill:var(--wire-on)}
.sw:focus-visible rect{stroke:var(--beacon);stroke-width:3}
.gate rect{fill:var(--gate);stroke:var(--wire-off);stroke-width:2} .gate text{font-family:var(--f-display);font-weight:700;font-size:15px;text-anchor:middle;fill:var(--ink)}
.gate.on rect{stroke:var(--wire-on)}
.not rect{fill:var(--gate);stroke:var(--muted);stroke-width:1.2} .not text{font-family:var(--f-display);font-size:10px;font-weight:700;text-anchor:middle;fill:var(--muted)}
.lamp{fill:var(--wire-off);transition:fill .3s} .lamp.on{fill:var(--beacon);filter:drop-shadow(0 0 8px var(--beacon))}
.olabel{font-family:var(--f-display);font-size:11px;text-anchor:middle;fill:var(--muted)}
.qq{font-weight:600;font-size:1.08rem;margin:.4rem 0 .8rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.55rem}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:.75em 1em;min-height:48px;font-size:.98rem}
.opt:hover:not(:disabled){border-color:var(--signal)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel));color:var(--ink)}
.opt.wrong{border-color:var(--bad);opacity:.6;text-decoration:line-through}
.opt:disabled{cursor:default}
.qex p{background:var(--panel-2);border-radius:12px;padding:.8em 1em;margin:.6rem 0 0}
.tabs{display:flex;gap:.5rem;margin:0 0 .9rem;padding-right:46px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.45em 1em;font-family:var(--f-display);font-weight:600;color:var(--muted);min-height:40px}
.tab.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.hmwrap{width:100%;border-radius:14px;overflow:hidden;background:#000}
.hm{width:100%;display:block;cursor:pointer}
.hpill{min-height:1.6em;margin:.7rem 0 0;display:flex;gap:.5em;align-items:center;flex-wrap:wrap;font-size:.93rem}
.hpill span{color:var(--muted)} .hpill em{font-style:normal;font-family:var(--f-display);font-size:.82rem;color:var(--muted)} .hpill em.ok{color:var(--beacon-ink)}
.ign{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:.6rem 0 .2rem;color:var(--beacon-ink)}
.meaning{color:var(--muted);margin:.2rem 0 0;max-width:60ch}
.pdone{margin:0 auto 0 0;font-family:var(--f-display);font-weight:600;color:var(--ok)}
.loglist{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.logrow{width:100%;display:flex;gap:.8em;align-items:center;text-align:left;background:var(--panel-2);border:1px solid transparent;border-radius:12px;padding:.6em .9em;color:var(--ink)}
.logrow:hover{border-color:var(--line)}
.logrow i{width:10px;height:10px;border-radius:50%;background:var(--wire-off);flex:none}
.logrow.ok i{background:var(--beacon);box-shadow:0 0 8px var(--beacon)}
.logrow span{flex:1;min-width:0} .logrow b{display:block;font-weight:600} .logrow small{color:var(--muted)}
.logrow em{font-style:normal;font-family:var(--f-display);font-size:.8rem;color:var(--muted);white-space:nowrap} .logrow.ok em{color:var(--beacon-ink)}
.src{padding-left:1.1em} .src li{margin:.4em 0} .src span{display:block;color:var(--muted);font-size:.88rem}
/* final */
#scrFinal{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:1rem}
#scrFinal h2{font-family:var(--f-display);font-weight:700;font-size:clamp(2.2rem,6vw,4rem);margin:0;color:transparent;-webkit-text-stroke:1.2px #ffe0a0;text-shadow:0 0 30px rgba(244,182,63,.45)}
#scrFinal p{max-width:40rem;color:#c9d0e2}
#scrFinal .btn:not(.primary){color:var(--hud-ink);border-color:rgba(255,255,255,.2)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="app">
 <canvas id="stars" aria-hidden="true"></canvas>

 <section class="screen on" id="scrTitle" aria-label="Chronicles of Cosmic Relics">
  <div class="tcorner"><button class="hudbtn" id="langBtn" data-tt="lang">EN</button><button class="hudbtn" id="soundBtn" data-tt="sound" aria-pressed="true">♪</button></div>
  <div class="globe-wrap"><canvas id="globeTitle" aria-hidden="true"></canvas></div>
  <div class="ttext">
   <p class="kicker" data-t="challenge"></p>
   <h1 class="title"><span>Chronicles of</span><span>Cosmic Relics</span></h1>
   <p class="sub" data-t="subtitle"></p>
   <p class="story" data-t="story"></p>
   <div class="trow"><button class="btn primary" id="btnStart" disabled>…</button><button class="btn" id="btnSourcesTitle" data-t="sources"></button></div>
   <p id="loading">…</p>
  </div>
 </section>

 <section class="screen" id="scrPlanets">
  <h2 data-t="choose"></h2>
  <div class="pcards">
   <div class="pcard" id="pc-moon"><canvas id="globe-moon" aria-hidden="true"></canvas><h3 data-t="moon"></h3><p data-t="moonDesc"></p><span class="pc-prog"></span><div class="pc-bar"><i></i></div><button class="btn primary pc-go" data-p="moon"></button></div>
   <div class="pcard" id="pc-mars"><canvas id="globe-mars" aria-hidden="true"></canvas><h3 data-t="mars"></h3><p data-t="marsDesc"></p><span class="pc-prog"></span><div class="pc-bar"><i></i></div><button class="btn primary pc-go" data-p="mars"></button></div>
   <div class="pcard" id="pc-deep"><canvas id="globe-deep" aria-hidden="true"></canvas><h3 data-t="deep"></h3><p data-t="deepDesc"></p><span class="pc-prog"></span><div class="pc-bar"><i></i></div><button class="btn primary pc-go" data-p="deep"></button></div>
  </div>
  <button class="btn" id="btnBack" data-t="back" style="color:var(--hud-ink);border-color:rgba(255,255,255,.2)"></button>
 </section>

 <section class="screen" id="scrMap">
  <canvas id="map" aria-label="Map"></canvas>
  <div class="hudtop">
   <button class="hudbtn" id="planetChip" data-tt="planetSwitch">—</button>
   <div id="coord" aria-live="off">0.00°N, 0.00°E</div>
   <span class="spacer"></span>
   <button class="hudbtn" id="btnHeritage" data-t="heritage"></button>
   <button class="hudbtn" id="btnLog" data-t="log"></button>
   <button class="hudbtn" id="langBtn2" data-tt="lang">EN</button>
   <button class="hudbtn" id="btnSources" data-tt="sources">i</button>
  </div>
  <div class="scanner"><div class="compass"><svg id="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h15M13 6l6 6-6 6" fill="none" stroke="#5fd0e6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
   <div><small id="nearLabel"></small><span id="nearName"></span><span id="nearDist"></span><span id="prog"></span></div></div>
  <button class="btn primary" id="interact" hidden></button>
 </section>

 <section class="screen" id="scrFinal">

{id:'surveyor7', planet:'moon', kind:'lander', mini:'antenna', lat:-40.86, lon:-11.47, date:'1968-01-10', dateKind:'landed',

{id:'ranger7', planet:'moon', kind:'impact', mini:'circuit', lat:-10.35, lon:-20.58, date:'1964-07-31', dateKind:'impact',

{id:'lcross', planet:'moon', kind:'impact', mini:'antenna', lat:-84.68, lon:-48.70, date:'2009-10-09', dateKind:'impact',

 voice:{vi:'Tôi lao vào bóng tối vĩnh cửu ở cực Nam để tìm câu trả lời: Mặt Trăng có nước không? Câu trả lời là CÓ.', en:'I dove into the eternal dark of the south pole to answer one question: is there water on the Moon? The answer is YES.'},

 facts:{vi:['Chụp những bức ảnh rõ nét đầu tiên từ bề mặt Sao Hỏa và làm việc hơn 6 năm.','Làm các thí nghiệm tìm dấu hiệu sự sống trong đất – kết quả đến nay vẫn còn được tranh luận.','Một lệnh phần mềm nhầm lẫn năm 1982 đã làm ăng-ten quay khỏi Trái Đất, và liên lạc mất từ đó.'],
        en:['It took the first clear pictures from the Martian surface and worked for more than 6 years.','It tested the soil for signs of life – scientists still debate the results.','A mistaken software command in 1982 turned its antenna away from Earth, and contact was lost.']},
 voice:{vi:'Một lệnh nhầm năm 1982 đã khiến ăng-ten của tôi quay đi khỏi Trái Đất. Từ đó tôi chỉ nghe thấy im lặng...', en:'A wrong command in 1982 turned my antenna away from Earth. Since then I have heard only silence...'},
 quiz:{q:{vi:'Vì sao Viking 1 mất liên lạc với Trái Đất năm 1982?', en:'Why did Viking 1 lose contact with Earth in 1982?'},
  o:{vi:['Một lệnh phần mềm nhầm làm ăng-ten quay khỏi Trái Đất','Bị bão cát chôn vùi','Bị thiên thạch rơi trúng','Hết nhiên liệu tên lửa'], en:['A mistaken command pointed its antenna away from Earth','A sandstorm buried it','A meteorite hit it','It ran out of rocket fuel']},
  ex:{vi:'Lệnh cập nhật phần mềm pin đã vô tình ghi đè lên dữ liệu điều khiển hướng ăng-ten. Đó là lý do bạn vừa phải căn ăng-ten về Trái Đất!', en:'A battery-software update accidentally overwrote the antenna-pointing data. That\u2019s why you just had to aim it back at Earth!'}}},

{id:'viking2', planet:'mars', kind:'lander', mini:'circuit', lat:47.64, lon:134.29, date:'1976-09-03', dateKind:'landed',
 name:'Viking 2',
 site:{vi:'Đồng bằng Utopia (Utopia Planitia)', en:'Utopia Planitia'},
 mission:{vi:'Tàu đổ bộ thứ hai của chương trình Viking.', en:'The second lander of the Viking programme.'},
 ended:{vi:'Ngừng hoạt động ngày 11/04/1980 do hỏng pin.', en:'Stopped working on Apr 11, 1980, after a battery failure.'},
 facts:{vi:['Chụp được lớp sương giá mỏng phủ trên mặt đất vào mùa đông Sao Hỏa.','Mang theo máy đo địa chấn để thử "lắng nghe" Sao Hỏa.','Hoạt động hơn 3,5 năm ở vùng đồng bằng phía bắc.'],
        en:['It photographed thin frost on the ground during the Martian winter.','It carried a seismometer to try to "listen" to Mars.','It worked for more than 3.5 years on the northern plains.']},
 voice:{vi:'Mùa đông ở Utopia, tôi đã chụp được lớp sương giá mỏng phủ trên những hòn đá đỏ.', en:'In the Utopia winter, I photographed thin frost on the red rocks.'},
 quiz:{q:{vi:'Viking 2 đã chụp được hiện tượng gì trên mặt đất Sao Hỏa vào mùa đông?', en:'What did Viking 2 photograph on the ground in the Martian winter?'},
  o:{vi:['Lớp sương giá mỏng','Mưa rào','Cầu vồng','Hồ nước'], en:['Thin frost','A rain shower','A rainbow','A lake']},
  ex:{vi:'Lớp sương giá rất mỏng bám trên đá và đất ở đồng bằng Utopia, cho thấy nước vẫn tồn tại trên Sao Hỏa dưới dạng băng và hơi.', en:'A very thin frost coated the rocks and soil, showing that water still exists on Mars as ice and vapour.'}}},

{id:'pathfinder', planet:'mars', kind:'rover', mini:'antenna', lat:19.13, lon:-33.22, date:'1997-07-04', dateKind:'landed',
 name:'Mars Pathfinder & Sojourner',
 site:{vi:'Thung lũng Ares (Ares Vallis)', en:'Ares Vallis'},
 mission:{vi:'Trạm đổ bộ và chiếc xe tự hành đầu tiên lăn bánh trên Sao Hỏa.', en:'A lander and the first rover to roll across Mars.'},
 ended:{vi:'Liên lạc lần cuối ngày 27/09/1997.', en:'Last contact on Sep 27, 1997.'},
 facts:{vi:['Hạ cánh bằng cách nảy trên những túi khí khổng lồ, bật lên nhiều lần rồi mới dừng.','Xe Sojourner chỉ nặng khoảng 11 kg, nhỏ cỡ một chiếc lò vi sóng, đã phân tích hóa học nhiều tảng đá.','Trạm đổ bộ được đặt tên là Trạm Tưởng niệm Carl Sagan.'],

 quiz:{q:{vi:'Mars Pathfinder đã hạ cánh xuống Sao Hỏa bằng cách nào?', en:'How did Mars Pathfinder land on Mars?'},
  o:{vi:['Nảy trên những túi khí khổng lồ','Hạ cánh trên đường băng như máy bay','Đáp xuống mặt nước','Bám vào một sợi dây từ khinh khí cầu'], en:['Bouncing on giant airbags','On a runway, like a plane','Splashing down in water','Hanging from a balloon']},
  ex:{vi:'Túi khí bao quanh tàu giúp nó nảy trên mặt đất nhiều lần trước khi lăn và dừng lại an toàn.', en:'Airbags wrapped around the lander let it bounce repeatedly before rolling safely to a stop.'}}},

{id:'spirit', planet:'mars', kind:'rover', mini:'dust', dust:'solar', lat:-14.57, lon:175.47, date:'2004-01-04', dateKind:'landed',
 name:'Spirit (MER-A)',
 site:{vi:'Hố Gusev', en:'Gusev crater'},
 mission:{vi:'Xe tự hành song sinh của Opportunity.', en:'Opportunity\u2019s twin rover.'},
 ended:{vi:'Liên lạc lần cuối ngày 22/03/2010.', en:'Last contact on Mar 22, 2010.'},
 facts:{vi:['Được thiết kế để làm việc 90 ngày Sao Hỏa, nhưng đã hoạt động hơn 6 năm.','Bánh xe hỏng bị kéo lê đã cào lộ ra lớp đất gần như toàn silica – dấu vết của suối nước nóng cổ đại.','Năm 2009 nó mắc kẹt trong cát mềm và không thể nghiêng tấm pin về phía Mặt Trời để qua mùa đông.'],
        en:['Designed for 90 Martian days, it worked for more than 6 years.','Its broken, dragging wheel scraped up almost pure silica – a trace of ancient hot springs.','In 2009 it got stuck in soft sand and could not tilt its panels to the Sun for winter.']},
 voice:{vi:'Đôi khi những cơn lốc bụi đi ngang qua và thổi sạch tấm pin cho tôi – những người bạn tốt bụng của Sao Hỏa.', en:'Sometimes dust devils passed by and blew my solar panels clean – the kind friends of Mars.'},
 quiz:{q:{vi:'Điều gì bất ngờ đã giúp Spirit phát hiện ra đất gần như toàn silica?', en:'What unexpectedly helped Spirit discover almost pure silica?'},
  o:{vi:['Bánh xe hỏng bị kéo lê, cào lộ lớp đất bên dưới','Một trận động đất làm nứt mặt đất','Một trận mưa rửa trôi lớp bụi','Một thiên thạch rơi gần đó'], en:['A broken wheel dragging and scraping the soil','A quake cracking the ground','Rain washing the dust away','A nearby meteorite strike']},
  ex:{vi:'Silica tinh khiết thường hình thành nơi có nước nóng như suối nước nóng – dấu hiệu Sao Hỏa từng có môi trường có thể phù hợp cho vi sinh vật.', en:'Pure silica usually forms where hot water flows, like hot springs – a sign Mars once had places that might have suited microbes.'}}},

{id:'opportunity', planet:'mars', kind:'rover', mini:'dust', dust:'solar', lat:-1.948, lon:-5.526, date:'2004-01-25', dateKind:'landed',
 name:'Opportunity (Oppy)',
 site:{vi:'Thung lũng Perseverance, rìa hố Endeavour', en:'Perseverance Valley, rim of Endeavour crater'},
 mission:{vi:'Xe tự hành sống lâu và đi xa nhất của chương trình Mars Exploration Rover.', en:'The longest-lived, farthest-driving Mars Exploration Rover.'},
 ended:{vi:'Liên lạc lần cuối ngày 10/06/2018, giữa một cơn bão bụi phủ khắp hành tinh.', en:'Last contact on Jun 10, 2018, during a planet-wide dust storm.'},
 facts:{vi:['Được thiết kế cho 90 ngày và khoảng 1 km đường đi – nhưng đã làm việc gần 15 năm và đi 45,16 km, dài hơn một đường chạy marathon.','Tìm thấy những viên hematit nhỏ gọi là "quả việt quất" – bằng chứng Sao Hỏa từng có nước.','NASA tuyên bố kết thúc sứ mệnh ngày 13/02/2019, sau hơn 1.000 lệnh gọi không được hồi đáp.'],
        en:['Built for 90 days and about 1 km of driving, it worked for nearly 15 years and covered 45.16 km – farther than a marathon.','It found tiny hematite spheres nicknamed "blueberries" – evidence that Mars once had water.','NASA declared the mission over on Feb 13, 2019, after more than 1,000 unanswered calls.']},
 voice:{vi:'...My battery is low... and it\u2019s getting dark...', en:'...My battery is low... and it\u2019s getting dark...'},
 quiz:{q:{vi:'Opportunity được thiết kế để hoạt động 90 ngày Sao Hỏa. Thực tế nó đã hoạt động bao lâu?', en:'Opportunity was designed for 90 Martian days. How long did it actually work?'},
  o:{vi:['Gần 15 năm','Đúng 90 ngày','Khoảng 1 năm','Khoảng 6 tháng'], en:['Nearly 15 years','Exactly 90 days','About 1 year','About 6 months']},
  ex:{vi:'Từ 2004 đến 2018, Oppy đi được 45,16 km và đã lập kỷ lục quãng đường lái xe ngoài Trái Đất.', en:'From 2004 to 2018 Oppy drove 45.16 km and set the record for driving distance beyond Earth.'}}},

{id:'phoenix', planet:'mars', kind:'lander', mini:'circuit', lat:68.22, lon:-125.75, date:'2008-05-25', dateKind:'landed',
 name:'Phoenix',
 site:{vi:'Đồng bằng phương Bắc (Vastitas Borealis)', en:'Vastitas Borealis, the northern plains'},
 mission:{vi:'Tàu đổ bộ tìm nước ở vùng gần cực Bắc Sao Hỏa.', en:'A lander that hunted for water near Mars\u2019s north pole.'},
 ended:{vi:'Liên lạc lần cuối ngày 02/11/2008.', en:'Last contact on Nov 2, 2008.'},

 quiz:{q:{vi:'Làm sao Phoenix biết những mảng trắng trong rãnh đào là băng nước?', en:'How did Phoenix know the white patches in its trench were water ice?'},
  o:{vi:['Chúng biến mất dần sau vài ngày vì thăng hoa','Chúng phát ra tiếng nước chảy','Chúng có mùi muối biển','Chúng tan thành vũng nước lớn'], en:['They slowly vanished over a few days','They made a trickling sound','They smelled of sea salt','They melted into a big puddle']},
  ex:{vi:'Những mảng trắng nhỏ dần rồi biến mất – băng chuyển thẳng thành hơi trong không khí loãng của Sao Hỏa (thăng hoa). Muối thì không biến mất như vậy.', en:'The patches shrank and disappeared – ice turns straight into vapour in Mars\u2019s thin air (sublimation). Salt would not do that.'}}},

  c.beginPath(); c.moveTo(-8,-6); c.lineTo(8,-6); c.lineTo(10,0); c.lineTo(8,5); c.lineTo(-8,5); c.lineTo(-10,0); c.closePath(); c.globalAlpha=.85; c.fill(); c.globalAlpha=1;
  leg(-8,3,-14,10); leg(8,3,14,10); leg(-3,5,-5,11); leg(3,5,5,11);
  if(detail){ c.strokeStyle='rgba(0,0,0,.35)'; c.lineWidth=.8; c.beginPath(); c.moveTo(-8,-1); c.lineTo(8,-1); c.stroke(); }
 } else if(kind==='lander'){
  c.beginPath(); c.moveTo(-7,2); c.lineTo(7,2); c.lineTo(0,-4); c.closePath(); c.fill();
  leg(-5,2,-12,9); leg(5,2,12,9); leg(0,2,0,10);
  c.beginPath(); c.moveTo(0,-4); c.lineTo(0,-13); c.stroke();
  c.beginPath(); c.ellipse(-4,-14,5,2.4,-.5,0,TAU); c.globalAlpha=.85; c.fill(); c.globalAlpha=1;
  c.fillRect(1,-12,8,5);

  c.fillRect(-10,-4,20,6);
  for(const wx of [-8,0,8]){ c.beginPath(); c.arc(wx,5,3.2,0,TAU); c.fill(); }
  c.beginPath(); c.moveTo(6,-4); c.lineTo(6,-12); c.stroke(); c.fillRect(3,-15,7,3.5);
  c.globalAlpha=.7; c.fillRect(-11,-7,15,2); c.globalAlpha=1;
 } else if(kind==='heli'){
  c.beginPath(); c.ellipse(0,0,5,4,0,0,TAU); c.fill();
  c.beginPath(); c.moveTo(0,-4); c.lineTo(0,-11); c.stroke();
  c.lineWidth=1.8; c.beginPath(); c.moveTo(-13,-9); c.lineTo(13,-9); c.moveTo(-11,-12); c.lineTo(11,-12); c.stroke();
  c.lineWidth=1.4; leg(-3,3,-8,10); leg(3,3,8,10);
 } else if(kind==='probe'){
  c.beginPath(); c.ellipse(-1,-5,11,4.2,-.15,0,TAU); c.globalAlpha=.9; c.fill(); c.globalAlpha=1;
  c.beginPath(); c.moveTo(-1,-9); c.lineTo(-1,-14); c.stroke();
  c.fillRect(-4,-1,8,6);
  c.beginPath(); c.moveTo(4,3); c.lineTo(14,9); c.stroke(); c.beginPath(); c.arc(14.5,9.5,2.2,0,TAU); c.fill();
  c.lineWidth=1; c.beginPath(); c.moveTo(-4,2); c.lineTo(-17,5); c.stroke();

  c.globalAlpha=.9; c.lineWidth=2; c.beginPath(); c.ellipse(0,2,11,6,0,0,TAU); c.stroke();
  c.globalAlpha=.5; c.beginPath(); c.ellipse(0,2,6,3,0,0,TAU); c.fill(); c.globalAlpha=1;
  for(const [a,d] of [[-2.4,14],[-1.9,16],[-.9,15],[-.5,13],[-2.9,13]]){ c.beginPath(); c.arc(Math.cos(a)*d,2+Math.sin(a)*d*.7,1.3,0,TAU); c.fill(); }
 }
 c.restore();
}

// ===== MAP STATE =====
const cv=$('#map'), ctx=cv.getContext('2d');
let DPR=1, VW=0, VH=0;
const G={ planet:null, robot:{x:0,y:0,face:1,trail:[]}, target:null, targetRelic:null, keys:{}, near:null, mode:'title', time:0, burst:null, activeShown:{}, pointerDown:false };
function resize(){ DPR=Math.min(2,window.devicePixelRatio||1); VW=cv.clientWidth; VH=cv.clientHeight; cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR); drawStars(); }
window.addEventListener('resize',resize);

function setPlanet(p){
 if(!TERRAIN[p]) genTerrain(p);
 G.planet=p; S.planet=p;
 const pos=S.pos[p]; if(pos){ G.robot.x=pos.x; G.robot.y=pos.y; } else { const q=ll2xy(PLANETS[p].start[0],PLANETS[p].start[1]); G.robot.x=q.x; G.robot.y=q.y; }
 G.robot.trail=[]; G.target=null; G.targetRelic=null; save();
 $('#planetChip').textContent=pName(p); document.body.dataset.planet=p;
}

function zoomNow(){ return Math.max(1, VH/H, VW/W); }
function cam(){ const z=zoomNow(); const hh=VH/z; return {z, x:G.robot.x, y:clamp(G.robot.y, hh/2, H-hh/2)}; }
function toScreen(x,y,C){ return {x:VW/2+wrapDX(x-C.x)*C.z, y:VH/2+(y-C.y)*C.z}; }
function toWorld(sx,sy,C){ return {x:modW(C.x+(sx-VW/2)/C.z), y:clamp(C.y+(sy-VH/2)/C.z,0,H)}; }

// ===== INPUT =====
function pointerWorld(e){ const r=cv.getBoundingClientRect(); return toWorld(e.clientX-r.left, e.clientY-r.top, cam()); }
cv.addEventListener('pointerdown',e=>{ if(G.mode!=='map') return; G.pointerDown=true; cv.setPointerCapture(e.pointerId); setTargetFrom(e,true); hideTut(); });
cv.addEventListener('pointermove',e=>{ if(G.mode!=='map'||!G.pointerDown) return; setTargetFrom(e,false); });
const up=()=>{ G.pointerDown=false; }; cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
function setTargetFrom(e,allowSnap){ const w=pointerWorld(e); G.targetRelic=null;
 if(allowSnap){ const C=cam(); for(const r of relicsOf(G.planet)){ const p=ll2xy(r.lat,r.lon); const d=Math.hypot(wrapDX(p.x-w.x),p.y-w.y)*C.z; if(d<30){ G.target={x:p.x,y:p.y}; G.targetRelic=r; return; } } }
 G.target=w; }
window.addEventListener('keydown',e=>{ if(G.mode!=='map') return; const k=e.key.toLowerCase(); if(['arrowup','arrowdown','arrowleft','arrowright','w','a','s','d'].includes(k)){ G.keys[k]=true; G.target=null; e.preventDefault(); hideTut(); }
 if((k==='enter'||k===' ')&&G.near&&!document.querySelector('.overlay.open')){ e.preventDefault(); openRelic(G.near); } });
window.addEventListener('keyup',e=>{ G.keys[e.key.toLowerCase()]=false; });

// ===== UPDATE =====
let lastSave=0, lastHud=0;
function update(dt){
 const rb=G.robot, sp=250; let vx=0, vy=0; const k=G.keys;
 if(k.arrowleft||k.a) vx-=1; if(k.arrowright||k.d) vx+=1; if(k.arrowup||k.w) vy-=1; if(k.arrowdown||k.s) vy+=1;
 let moved=false;
 if(vx||vy){ const n=Math.hypot(vx,vy); rb.x+=vx/n*sp*dt; rb.y+=vy/n*sp*dt; if(vx) rb.face=Math.sign(vx); moved=true; }
 else if(G.target){ const dx=wrapDX(G.target.x-rb.x), dy=G.target.y-rb.y, d=Math.hypot(dx,dy); const stop=G.targetRelic?16:0;
  if(d<=stop+sp*dt){ if(!G.targetRelic){ rb.x=G.target.x; rb.y=G.target.y; } G.target=null; }
  else { rb.x+=dx/d*sp*dt; rb.y+=dy/d*sp*dt; if(Math.abs(dx)>1) rb.face=Math.sign(dx); moved=true; } }
 rb.x=modW(rb.x); rb.y=clamp(rb.y,14,H-14);
 if(moved){ const lt=rb.trail[rb.trail.length-1]; if(!lt||Math.hypot(wrapDX(rb.x-lt.x),rb.y-lt.y)>7){ rb.trail.push({x:rb.x,y:rb.y}); if(rb.trail.length>160) rb.trail.shift(); } }
 // proximity
 let best=null,bd=1e9; for(const r of relicsOf(G.planet)){ const p=ll2xy(r.lat,r.lon); const d=Math.hypot(wrapDX(p.x-rb.x),p.y-rb.y); if(d<bd){bd=d;best=r;} }
 G.near = bd<34? best:null;
 for(const a of ACTIVE.filter(a=>a.planet===G.planet)){ const p=ll2xy(a.lat,a.lon); const d=Math.hypot(wrapDX(p.x-rb.x),p.y-rb.y); if(d<40&&!G.activeShown[a.name]){ G.activeShown[a.name]=1; toast(L(a.note)); } if(d>120) G.activeShown[a.name]=0; }
 const now=performance.now();
 if(now-lastSave>2000){ lastSave=now; S.pos[G.planet]={x:rb.x,y:rb.y}; save(); }
 if(now-lastHud>120){ lastHud=now; updateHud(); }
}

function updateHud(){
 const rb=G.robot, ll=xy2ll(rb.x,rb.y), p=G.planet;
 $('#coord').textContent=fmtCoord(ll.lat,ll.lon,p);
 const todo=relicsOf(p).filter(r=>!isDone(r.id));
 $('#prog').textContent=t('progress',{n:doneCount(p),t:relicsOf(p).length});
 const arrow=$('#arrow');
 if(todo.length){ let best=null,bd=1e9; for(const r of todo){ const d=gcKm(ll.lat,ll.lon,r.lat,r.lon,PLANETS[p].R); if(d<bd){bd=d;best=r;} }
  $('#nearName').textContent=best.name; $('#nearDist').textContent= p==='deep'? bd.toFixed(1)+'°' : fmtNum(Math.round(bd))+' '+t('km'); $('#nearLabel').textContent=t('nearest');
  const q=ll2xy(best.lat,best.lon); const ang=Math.atan2(q.y-rb.y, wrapDX(q.x-rb.x)); arrow.style.transform=`rotate(${ang}rad)`; arrow.style.opacity=1;
 } else { $('#nearLabel').textContent=t('allLit'); $('#nearName').textContent=''; $('#nearDist').textContent=''; arrow.style.opacity=0; }
 const btn=$('#interact');
 if(G.near){ btn.hidden=false; btn.textContent=isDone(G.near.id)? t('viewFile',{name:G.near.name}) : t('scan',{name:G.near.name}); btn.classList.toggle('done',isDone(G.near.id)); }
 else btn.hidden=true;
}

// ===== RENDER MAP =====
function render(ts){
 const c=ctx, C=cam(), z=C.z, Tr=TERRAIN[G.planet]; c.setTransform(DPR,0,0,DPR,0,0);
 const sw=VW/z, sh=VH/z; const left=modW(C.x-sw/2), top=C.y-sh/2;
 const w1=Math.min(sw, W-left);
 c.imageSmoothingEnabled=true;
 c.drawImage(Tr.big,left,top,w1,sh,0,0,w1*z,VH);
 if(w1<sw) c.drawImage(Tr.big,0,top,sw-w1,sh,w1*z,0,(sw-w1)*z,VH);
 // grid
 c.lineWidth=1; c.strokeStyle='rgba(255,255,255,.07)'; c.fillStyle='rgba(255,255,255,.42)'; c.font='500 11px "Chakra Petch", sans-serif';
 for(let lon=-180;lon<180;lon+=15){ const s=toScreen(ll2xy(0,lon).x,0,C); if(s.x<-2||s.x>VW+2) continue; c.beginPath(); c.moveTo(s.x,0); c.lineTo(s.x,VH); c.stroke(); c.textAlign='left'; c.fillText(fmtLon(lon,G.planet,false).replace('.00',''),s.x+4,VH-10); }
 for(let lat=-75;lat<=75;lat+=15){ const s=toScreen(0,ll2xy(lat,0).y,C); if(s.y<0||s.y>VH) continue; c.beginPath(); c.moveTo(0,s.y); c.lineTo(VW,s.y); c.stroke(); c.textAlign='left'; c.fillText(G.planet==='deep'?(lat>0?'+':lat<0?'−':'')+Math.abs(lat)+'°':fmtLat(lat).replace('.00',''),6,s.y-4); }
 // labels
 c.textAlign='center'; c.font='500 13px "Chakra Petch", sans-serif';
 for(const [n,la,lo] of (G.planet==='moon'?MOON_LABELS:G.planet==='mars'?MARS_LABELS:DEEP_LABELS)){ const q=ll2xy(la,lo), s=toScreen(q.x,q.y,C); if(s.x<-120||s.x>VW+120||s.y<-20||s.y>VH+20) continue; c.fillStyle='rgba(0,0,0,.35)'; c.fillText(n,s.x+1,s.y+1); c.fillStyle='rgba(255,255,255,.62)'; c.fillText(n,s.x,s.y); }
 // trail
 const tr=G.robot.trail, dp=G.planet==='deep'; for(let i=0;i<tr.length;i++){ const s=toScreen(tr[i].x,tr[i].y,C); const k=i/tr.length; if(dp){ c.fillStyle=`rgba(95,208,230,${.05+.4*k})`; c.beginPath(); c.arc(s.x,s.y,1+1.5*k,0,TAU); c.fill(); } else { c.fillStyle=`rgba(20,16,12,${.06+.3*k})`; c.fillRect(s.x-4,s.y+5,3,2); c.fillRect(s.x+2,s.y+5,3,2); } }
 // target
 if(G.target){ const s=toScreen(G.target.x,G.target.y,C); c.strokeStyle='rgba(95,208,230,.8)'; c.lineWidth=1.5; c.beginPath(); c.arc(s.x,s.y,8+Math.sin(ts/150)*2,0,TAU); c.stroke(); }
 // active markers
 for(const a of ACTIVE.filter(a=>a.planet===G.planet)){ const q=ll2xy(a.lat,a.lon), s=toScreen(q.x,q.y,C); if(s.x<-40||s.x>VW+40) continue; const bl=(Math.sin(ts/300)+1)/2;
  c.fillStyle=`rgba(95,208,230,${.4+.6*bl})`; c.beginPath(); c.arc(s.x,s.y,4,0,TAU); c.fill(); c.strokeStyle='rgba(95,208,230,.5)'; c.beginPath(); c.arc(s.x,s.y,9,0,TAU); c.stroke();
  c.font='500 12px "Chakra Petch", sans-serif'; c.fillStyle='rgba(180,236,248,.9)'; c.fillText(a.name,s.x,s.y+22); }
 // relics
 for(const r of relicsOf(G.planet)){ const q=ll2xy(r.lat,r.lon), s=toScreen(q.x,q.y,C); if(s.x<-80||s.x>VW+80||s.y<-80||s.y>VH+80) continue; const done=isDone(r.id);
  if(done){ const pulse=1+.08*Math.sin(ts/500+q.x); c.save(); c.globalCompositeOperation='lighter';
   const g=c.createRadialGradient(s.x,s.y,0,s.x,s.y,62*pulse); g.addColorStop(0,'rgba(255,214,120,.75)'); g.addColorStop(.25,'rgba(244,182,63,.35)'); g.addColorStop(1,'rgba(244,140,40,0)'); c.fillStyle=g; c.beginPath(); c.arc(s.x,s.y,62*pulse,0,TAU); c.fill(); c.restore();
   drawIcon(c,r.kind,s.x,s.y,1,'#ffe3a1');
  } else { const ph=((ts/1600)+q.x*.001)%1; c.strokeStyle=`rgba(95,208,230,${.55*(1-ph)})`; c.lineWidth=1.5; c.beginPath(); c.arc(s.x,s.y,12+ph*22,0,TAU); c.stroke();
   drawIcon(c,r.kind,s.x,s.y,1,'rgba(206,210,222,.88)'); }
  const dRob=Math.hypot(wrapDX(q.x-G.robot.x),q.y-G.robot.y);
  if(done||dRob<260){ c.font='600 12px "Chakra Petch", sans-serif'; c.fillStyle='rgba(0,0,0,.45)'; c.fillText(r.name,s.x+1,s.y+27); c.fillStyle=done?'#ffd987':'#e9eef8'; c.fillText(r.name,s.x,s.y+26); }
 }
 // burst
 if(G.burst){ const b=G.burst, k=(ts-b.t0)/1400; if(k>1) G.burst=null; else { const q=ll2xy(b.r.lat,b.r.lon), s=toScreen(q.x,q.y,C); c.save(); c.globalCompositeOperation='lighter'; for(let i=0;i<3;i++){ const kk=clamp(k-i*.12,0,1); c.strokeStyle=`rgba(255,210,120,${(1-kk)*.8})`; c.lineWidth=3*(1-kk)+.5; c.beginPath(); c.arc(s.x,s.y,10+kk*140,0,TAU); c.stroke(); } c.restore(); } }
 // robot
 drawRobot(c, toScreen(G.robot.x,G.robot.y,C), ts);
}
function drawRobot(c,s,ts){
 const f=G.robot.face, bob=G.target||Object.values(G.keys).some(Boolean)?Math.sin(ts/70)*.8:0;
 c.save(); c.translate(s.x,s.y+bob); c.fillStyle='rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(0,11,15,4,0,0,TAU); c.fill();
 c.scale(f,1);
 c.fillStyle='#2b3150'; c.beginPath(); c.roundRect(-13,4,26,7,3.5); c.fill(); c.fillStyle='#5a6386'; for(let i=-9;i<=9;i+=6){ c.beginPath(); c.arc(i,7.5,2,0,TAU); c.fill(); }
 c.fillStyle='#eef2fa'; c.beginPath(); c.roundRect(-11,-10,22,15,4); c.fill(); c.strokeStyle='#9aa4bf'; c.lineWidth=1; c.stroke();
 c.fillStyle='#14203d'; c.beginPath(); c.roundRect(-3,-7,12,7,3); c.fill(); c.fillStyle='#5fd0e6'; c.beginPath(); c.arc(4,-3.5,2.2,0,TAU); c.fill();
 c.strokeStyle='#cfd6e6'; c.lineWidth=1.4; c.beginPath(); c.moveTo(-6,-10); c.lineTo(-8,-17); c.stroke();
 c.fillStyle=Math.sin(ts/250)>0?'#f4b63f':'#7a5a1e'; c.beginPath(); c.arc(-8,-18,2.2,0,TAU); c.fill();
 c.fillStyle='#f4b63f'; c.fillRect(-9,-4,6,2);
 c.restore();
}

// ===== STARFIELD (title/planet screens) =====
const bg=$('#stars');
function drawStars(){ const d=Math.min(2,devicePixelRatio||1); bg.width=bg.clientWidth*d; bg.height=bg.clientHeight*d; const c=bg.getContext('2d'); const R=mulberry32(4); c.clearRect(0,0,bg.width,bg.height);
 for(let i=0;i<(bg.width*bg.height)/2600;i++){ const a=R()*.8+.1; c.fillStyle=`rgba(${220+R()*35|0},${225+R()*30|0},255,${a})`; const s=R()<.06?2*d:1*d; c.fillRect(R()*bg.width,R()*bg.height,s,s); } }

// ===== GLOBE =====
function makeGlobe(canvas, pid, opts={}){
 const N=opts.res||300; canvas.width=N; canvas.height=N; const c=canvas.getContext('2d'); const img=c.createImageData(N,N), D=img.data;
 const tilt=(opts.tilt??12)*RAD, st=Math.sin(tilt), ct=Math.cos(tilt); const R=N/2-2, cx=N/2;
 const idx=[], lat=[], lonV=[], shade=[]; const Lx=-.55,Ly=.35,Lz=.76;
 for(let j=0;j<N;j++) for(let i=0;i<N;i++){ const x=(i+.5-cx)/R, y=(cx-j-.5)/R, rr=x*x+y*y; if(rr>1) continue; const z=Math.sqrt(1-rr);
  idx.push((j*N+i)*4); lat.push(Math.asin(clamp(z*st+y*ct,-1,1))); lonV.push(Math.atan2(x, z*ct-y*st));
  const l=Math.max(0,x*Lx+y*Ly+z*Lz); shade.push(opts.flat? (.75+.35*z) : clamp(.16+.95*l,0,1.1)*(.82+.18*z)); }
 const n=idx.length; const LA=new Float32Array(lat), LO=new Float32Array(lonV), SH=new Float32Array(shade), IX=new Int32Array(idx);
 const g={canvas,c,img,D,N,R,cx,st,ct,pid,rot:opts.rot??0,
  draw(ts){ const tex=TERRAIN[this.pid].tex, TD=tex.data, TW=tex.width, TH=tex.height; const rot=this.rot;
   for(let k=0;k<n;k++){ let lon=LO[k]+rot; let u=((lon/TAU+.5)%1+1)%1; const tx=(u*TW)|0, ty=clamp(((.5-LA[k]/Math.PI)*TH)|0,0,TH-1); const s=(ty*TW+tx)*4, o=IX[k], sh=SH[k];
    D[o]=TD[s]*sh; D[o+1]=TD[s+1]*sh; D[o+2]=TD[s+2]*sh; D[o+3]=255; }
   this.c.putImageData(this.img,0,0);
   // atmosphere rim
   const c=this.c; if(this.pid==='deep'){ c.save(); c.globalCompositeOperation='lighter'; const gr=c.createRadialGradient(cx,cx,R*.8,cx,cx,R); gr.addColorStop(0,'rgba(95,208,230,0)'); gr.addColorStop(1,'rgba(95,208,230,.28)'); c.fillStyle=gr; c.beginPath(); c.arc(cx,cx,R,0,TAU); c.fill(); c.restore(); } if(this.pid==='mars'){ c.save(); c.globalCompositeOperation='lighter'; const gr=c.createRadialGradient(cx,cx,R*.86,cx,cx,R*1.01); gr.addColorStop(0,'rgba(255,140,90,0)'); gr.addColorStop(1,'rgba(255,150,100,.22)'); c.fillStyle=gr; c.beginPath(); c.arc(cx,cx,R,0,TAU); c.fill(); c.restore(); }
   // beacons
   c.save(); c.globalCompositeOperation='lighter';
   for(const r of relicsOf(this.pid)){ const done=isDone(r.id); const la=r.lat*RAD, lo=r.lon*RAD-rot; const x=Math.cos(la)*Math.sin(lo), y=this.ct*Math.sin(la)-this.st*Math.cos(la)*Math.cos(lo), z=this.st*Math.sin(la)+this.ct*Math.cos(la)*Math.cos(lo);
    if(z<=0.02) continue; const px=cx+x*R, py=cx-y*R, a=Math.min(1,z*3);
    if(done){ const rr=R*.16*(1+.1*Math.sin(ts/400+r.lat)); const gr=c.createRadialGradient(px,py,0,px,py,rr); gr.addColorStop(0,`rgba(255,226,150,${a})`); gr.addColorStop(.3,`rgba(244,182,63,${.45*a})`); gr.addColorStop(1,'rgba(244,140,40,0)'); c.fillStyle=gr; c.beginPath(); c.arc(px,py,rr,0,TAU); c.fill(); }
    else { c.fillStyle=`rgba(160,220,235,${.35*a})`; c.beginPath(); c.arc(px,py,Math.max(1.2,R*.012),0,TAU); c.fill(); } }
   c.restore(); } };
 return g;
}

// ===== OVERLAYS / UI =====
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); }
function openOverlay(id){ const o=$('#'+id); o.classList.add('open'); o.setAttribute('aria-hidden','false'); const f=o.querySelector('button,[tabindex]'); if(f) setTimeout(()=>f.focus({preventScroll:true}),30); }
function closeOverlay(id){ const o=$('#'+id); o.classList.remove('open'); o.setAttribute('aria-hidden','true'); if(id==='ovRelic'){ FLOW++; ACTIVE_MINI.stop&&ACTIVE_MINI.stop(); } }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-close]'); if(b){ sfx.tap(); closeOverlay(b.dataset.close); } });
let toastTimer=0; function toast(msg,ms=4200){ const el=$('#toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('on'),ms); }
function hideTut(){ if(!S.tut){ S.tut=true; save(); $('#toast').classList.remove('on'); } }

function applyLang(){
 document.documentElement.lang=S.lang;
 document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));

let skipType=false;
function typeLines(box, lines){ skipType=false; return lines.reduce((pr,ln)=>pr.then(()=>new Promise(res=>{
  const row=document.createElement('p'); row.className='ln '+ln.who; if(ln.tag){ const tg=document.createElement('b'); tg.textContent=ln.tag; row.appendChild(tg); }
  const sp=document.createElement('span'); row.appendChild(sp); box.appendChild(row); row.scrollIntoView({block:'nearest'});
  const txt=ln.text, speed=reduceMotion?0:(ln.slow?42:14); let i=0;

// ===== MINI: DUST =====
function runDust(r,b,done){
 const kind=r.dust||'solar';
 b.innerHTML=`<h3>${t('m_dust')}</h3><p class="hint">${t('i_dust')}</p><div class="dustwrap"><canvas class="dbase"></canvas><canvas class="dlayer"></canvas><span class="dlabel">${t(kind)} – ${esc(r.name)}</span></div>
  <div class="meter"><span>${t('clean')}</span><div class="bar"><i></i></div><b class="num">0%</b></div>`;
 const wrap=b.querySelector('.dustwrap'), base=b.querySelector('.dbase'), dl=b.querySelector('.dlayer'); const w=wrap.clientWidth, h=Math.round(w*.56); wrap.style.height=h+'px';

 if(kind==='solar'){ bc.fillStyle='#8b93a6'; bc.fillRect(0,0,w,h); const cols=10, rows=5, pad=8, cw=(w-pad*2)/cols, ch=(h-pad*2)/rows;
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){ const x=pad+i*cw, y=pad+j*ch; const g=bc.createLinearGradient(x,y,x+cw,y+ch); g.addColorStop(0,'#1d3f8f'); g.addColorStop(.5,'#2f5fc4'); g.addColorStop(1,'#163170'); bc.fillStyle=g; bc.fillRect(x+1.5,y+1.5,cw-3,ch-3); bc.strokeStyle='rgba(200,220,255,.25)'; bc.lineWidth=.6; bc.beginPath(); bc.moveTo(x+cw/2,y+2); bc.lineTo(x+cw/2,y+ch-2); bc.stroke(); }
  const sh=bc.createLinearGradient(0,0,w,h); sh.addColorStop(0,'rgba(255,255,255,.18)'); sh.addColorStop(.4,'rgba(255,255,255,0)'); bc.fillStyle=sh; bc.fillRect(0,0,w,h); }
 else { const tiles=12; for(let i=0;i<tiles;i++){ const x=i*w/tiles; const g=bc.createLinearGradient(x,0,x+w/tiles,h); g.addColorStop(0,'#dfe6ef'); g.addColorStop(.5,'#a9b4c4'); g.addColorStop(1,'#eef3f9'); bc.fillStyle=g; bc.fillRect(x+1,4,w/tiles-2,h-8); } }

 const iv=setInterval(()=>{ const data=c.getImageData(0,0,dl.width,dl.height).data; let clear=0,tot=0; for(let i=3;i<data.length;i+=4*7){ tot++; if(data[i]<60) clear++; } const k=clear/tot; const v=Math.min(100,Math.round(k/.93*100)); bar.style.width=v+'%'; pc.textContent=v+'%';

// ===== MINI: ANTENNA =====
function runAntenna(r,b,done){
 b.innerHTML=`<h3>${t('m_antenna')}</h3><p class="hint">${t('i_antenna')}</p><div class="antwrap"><canvas class="ant" tabindex="0" aria-label="${t('m_antenna')}"></canvas></div>
  <div class="antctl"><button class="btn round" id="aL" aria-label="◀">◀</button><div class="meter"><span>${t('signal')}</span><div class="bar"><i></i></div><b class="num">0%</b></div><button class="btn round" id="aR" aria-label="▶">▶</button></div><p class="amsg" role="status"></p>`;
 const cnv=b.querySelector('.ant'), wrap=b.querySelector('.antwrap'); const w=wrap.clientWidth, h=Math.round(w*.58); const d=Math.min(2,devicePixelRatio||1); cnv.width=w*d; cnv.height=h*d; cnv.style.height=h+'px'; const c=cnv.getContext('2d'); c.scale(d,d);
 const mars=r.planet==='mars', deep=r.planet==='deep'; const R=mulberry32(Date.now()&0xfff);
 const target=30+R()*120; let ang=target+(R()<.5?-1:1)*(55+R()*35); ang=clamp(ang,8,172); let hold=0, locked=false, alive=true, dragging=false, last=performance.now(), hb=0;
 const piv={x:w*.5,y:h*.8}; const stars=[...Array(70)].map(()=>({x:R()*w,y:R()*h*.75,a:R()}));
 const setFromPt=e=>{ const rc=cnv.getBoundingClientRect(); const x=e.clientX-rc.left, y=e.clientY-rc.top; ang=clamp(Math.atan2(piv.y-y,x-piv.x)/RAD,5,175); };
 cnv.addEventListener('pointerdown',e=>{ if(locked) return; dragging=true; cnv.setPointerCapture(e.pointerId); setFromPt(e); });

 cnv.addEventListener('pointerup',()=>dragging=false);

 for(const [id,dir] of [['#aL',1],['#aR',-1]]){ const el=b.querySelector(id); el.addEventListener('pointerdown',()=>press(dir)); el.addEventListener('pointerup',rel); el.addEventListener('pointerleave',rel); el.addEventListener('click',()=>{ if(!locked) ang=clamp(ang+dir*1.5,5,175); }); }

  bar.style.width=Math.round(str*100)+'%'; pc.textContent=Math.round(str*100)+'%';
  // draw
  const g=c.createLinearGradient(0,0,0,h); g.addColorStop(0,mars?'#3a2228':'#070b1c'); g.addColorStop(1,mars?'#8a4a33':'#141a33'); c.fillStyle=g; c.fillRect(0,0,w,h);
  for(const s of stars){ c.fillStyle=`rgba(255,255,255,${.25+.5*s.a})`; c.fillRect(s.x,s.y,1.2,1.2); }

  else if(vis>0){ const er=mars?4:16; c.globalAlpha=vis; c.fillStyle='#4f8fe0'; c.beginPath(); c.arc(ex,ey,er,0,TAU); c.fill(); if(!mars){ c.fillStyle='rgba(255,255,255,.75)'; c.beginPath(); c.arc(ex-4,ey-4,5,0,TAU); c.fill(); } c.font='600 12px "Chakra Petch",sans-serif'; c.fillStyle='#cfe3ff'; c.textAlign='center'; c.fillText(t('earth'),ex,ey+er+14); c.globalAlpha=1; }
  // beam
  const bl=w*.8; c.save(); c.translate(piv.x,piv.y-34); c.rotate(-ang*RAD); const bg2=c.createLinearGradient(0,0,bl,0); bg2.addColorStop(0,`rgba(95,208,230,${.15+.45*str})`); bg2.addColorStop(1,'rgba(95,208,230,0)'); c.fillStyle=bg2; c.beginPath(); c.moveTo(0,0); c.lineTo(bl,-bl*.12); c.lineTo(bl,bl*.12); c.closePath(); c.fill(); c.restore();

  drawIcon(c,r.kind==='heli'?'lander':r.kind,piv.x,piv.y-6,2.2,'#c7cbd6');
  // mast + dish
  c.strokeStyle='#dfe4ee'; c.lineWidth=3; c.beginPath(); c.moveTo(piv.x,piv.y-14); c.lineTo(piv.x,piv.y-34); c.stroke();
  c.save(); c.translate(piv.x,piv.y-34); c.rotate(-ang*RAD); c.fillStyle='#eef2fa'; c.beginPath(); c.ellipse(4,0,5,17,0,-Math.PI/2,Math.PI/2); c.fill(); c.strokeStyle='#9aa4bf'; c.lineWidth=1; c.stroke(); c.strokeStyle='#eef2fa'; c.lineWidth=1.5; c.beginPath(); c.moveTo(4,-15); c.lineTo(20,0); c.lineTo(4,15); c.stroke(); c.fillStyle=locked?'#f4b63f':'#5fd0e6'; c.beginPath(); c.arc(20,0,2.6,0,TAU); c.fill(); c.restore();

  for(let i=0;i<=sw;i+=2){ const yy=sy+shh/2+Math.sin(i*.18+ts/90)*str*13+(Math.random()-.5)*(1-str)*30; i?c.lineTo(sx+i,yy):c.moveTo(sx+i,yy); } c.stroke();
  requestAnimationFrame(loop); };

}

// ===== MINI: CIRCUIT =====
function runCircuit(r,b,done){
 const ev=(g,a,c)=>g==='AND'?(a&c):g==='OR'?(a|c):(a^c);
 const R=mulberry32((Date.now()^r.lat*997)&0xffffff); let P;
 for(let tries=0;tries<200;tries++){ const gs=['AND','OR','XOR']; const g=[0,1,2].map(()=>gs[(R()*3)|0]); const nt=[0,1,2,3].map(()=>R()<.3);
  const f=s=>ev(g[2],ev(g[0],s[0]^nt[0],s[1]^nt[1]),ev(g[1],s[2]^nt[2],s[3]^nt[3]));
  let sols=0; for(let m=0;m<16;m++){ if(f([m&1,m>>1&1,m>>2&1,m>>3&1])) sols++; }
  if(sols<1||sols>5) continue; let init=null; for(let k=0;k<20;k++){ const m=(R()*16)|0; const s=[m&1,m>>1&1,m>>2&1,m>>3&1]; if(!f(s)){ init=s; break; } } if(!init) continue; P={g,nt,f,s:init}; break; }
 const used=new Set(P.g); if(P.nt.some(Boolean)) used.add('NOT');
 b.innerHTML=`<h3>${t('m_circuit')}</h3><p class="hint">${t('i_circuit')}</p><ul class="legend">${['AND','OR','XOR','NOT'].filter(x=>used.has(x)).map(x=>`<li>${t('g_'+x)}</li>`).join('')}</ul><div class="circ"></div><p class="cmsg" role="status"></p>`;
 const box=b.querySelector('.circ'); let solved=false;
 const draw=()=>{ const s=P.s, nt=P.nt; const v=s.map((x,i)=>x^nt[i]); const g1=ev(P.g[0],v[0],v[1]), g2=ev(P.g[1],v[2],v[3]), o=ev(P.g[2],g1,g2);
  const on='var(--wire-on)', off='var(--wire-off)'; const ys=[40,95,165,220], yin=[55,80,180,205];
  let svg=`<svg viewBox="0 0 430 260" role="group" aria-label="${t('m_circuit')}">`;
  for(let i=0;i<4;i++){ const y=ys[i]; if(nt[i]){ svg+=`<path d="M78 ${y} H116" class="w" stroke="${s[i]?on:off}"/><g class="not"><rect x="116" y="${y-11}" width="34" height="22" rx="4"/><text x="133" y="${y+4}">NOT</text></g><path d="M150 ${y} H162 L178 ${yin[i]} H196" class="w" stroke="${v[i]?on:off}"/>`; }
   else svg+=`<path d="M78 ${y} H162 L178 ${yin[i]} H196" class="w" stroke="${v[i]?on:off}"/>`;
   svg+=`<g class="sw ${s[i]?'on':''}" data-i="${i}" tabindex="0" role="switch" aria-checked="${!!s[i]}" aria-label="${'ABCD'[i]}"><rect x="14" y="${y-16}" width="64" height="32" rx="16"/><circle cx="${s[i]?62:30}" cy="${y}" r="11"/><text x="${s[i]?30:62}" y="${y+5}">${'ABCD'[i]}</text></g>`; }
  const gate=(x,y,name,val)=>`<g class="gate ${val?'on':''}"><rect x="${x}" y="${y}" width="66" height="54" rx="10"/><text x="${x+33}" y="${y+33}">${name}</text></g>`;
  svg+=gate(196,40,P.g[0],g1)+gate(196,165,P.g[1],g2);
  svg+=`<path d="M262 67 H282 L300 118 H318" class="w" stroke="${g1?on:off}"/><path d="M262 192 H282 L300 142 H318" class="w" stroke="${g2?on:off}"/>`;
  svg+=gate(318,103,P.g[2],o)+`<path d="M384 130 H398" class="w" stroke="${o?on:off}"/><circle class="lamp ${o?'on':''}" cx="412" cy="130" r="13"/><text class="olabel" x="412" y="160">${t('out')}</text></svg>`;
  box.innerHTML=svg;
  box.querySelectorAll('.sw').forEach(el=>{ const tog=()=>{ if(solved) return; const i=+el.dataset.i; P.s[i]^=1; sfx.tap(); draw(); }; el.addEventListener('click',tog); el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); tog(); const n=box.querySelector(`.sw[data-i="${el.dataset.i}"]`); n&&n.focus(); } }); });
  if(o&&!solved){ solved=true; sfx.ok(); setTimeout(done,1100); } };
 draw(); ACTIVE_MINI.stop=()=>{};
}

// ===== HERITAGE MAP =====
let HM={alive:false};
function openHeritage(opt){
 const ign=opt.ignite||null; let pid=ign?ign.planet:(opt.planet||G.planet||'moon'); if(!TERRAIN[pid]) genTerrain(pid);
 openOverlay('ovHeritage'); const box=$('#heritageBody');
 const draw=()=>{
  const done=doneCount(pid), tot=relicsOf(pid).length, all=RELICS.every(r=>isDone(r.id)); const nextP=['moon','mars','deep'].find(p=>p!==pid&&doneCount(p)<relicsOf(p).length);
  box.innerHTML=`<div class="tabs" role="tablist">${['moon','mars','deep'].map(p=>`<button role="tab" class="tab ${p===pid?'on':''}" aria-selected="${p===pid}" data-p="${p}">${pName(p)} <span class="num">${doneCount(p)}/${relicsOf(p).length}</span></button>`).join('')}</div>
   <div class="hmwrap"><canvas class="hm"></canvas></div><p class="hpill" role="status"></p>
   ${ign&&ign.planet===pid?`<p class="ign">${esc(t('ignited',{name:ign.name,p:pName(pid)}))}</p>`:''}
   <p class="meaning">${ign? t('meaning') : t('heritageHint')}</p>
   <div class="actions">${ign&&done===tot&&!all?`<p class="pdone">${t('planetDone',{p:pName(pid)})}</p>`:''}
    ${all&&ign?`<button class="btn primary glow" id="hFinal">${t('finish')}</button>`:''}
    ${ign&&done===tot&&!all&&nextP?`<button class="btn" id="hOther">${t('goTo',{p:pName(nextP)})}</button>`:''}
    <button class="btn ${all&&ign?'':'primary'}" data-close="ovHeritage">${t('explore')}</button></div>`;
  box.querySelectorAll('.tab').forEach(tb=>tb.onclick=()=>{ sfx.tap(); pid=tb.dataset.p; if(!TERRAIN[pid]) genTerrain(pid); draw(); });
  const f=$('#hFinal'); if(f) f.onclick=()=>{ closeOverlay('ovHeritage'); openFinal(); };
  const o=$('#hOther'); if(o) o.onclick=()=>{ closeOverlay('ovHeritage'); enterMap(nextP); };
  const cnv=box.querySelector('.hm'), wrap=box.querySelector('.hmwrap'); const w=wrap.clientWidth, h=w/2; const d=Math.min(2,devicePixelRatio||1); cnv.width=w*d; cnv.height=h*d; cnv.style.height=h+'px'; const c=cnv.getContext('2d');
  const t0=performance.now(); let sel=null;
  cnv.onclick=e=>{ const rc=cnv.getBoundingClientRect(); const x=e.clientX-rc.left, y=e.clientY-rc.top; let best=null,bd=22; for(const r of relicsOf(pid)){ const px=(r.lon+180)/360*w, py=(90-r.lat)/180*h; const dd=Math.hypot(px-x,py-y); if(dd<bd){bd=dd;best=r;} }
   sel=best; const pill=box.querySelector('.hpill'); if(best){ sfx.tap(); pill.innerHTML=`<b>${esc(best.name)}</b> <span>${esc(L(best.site))}</span> <em class="${isDone(best.id)?'ok':''}">${t(isDone(best.id)?'restoredTag':'waitingTag')}</em> <button class="btn sm" id="hGo">${t('goHere')}</button>`;
    $('#hGo').onclick=()=>{ closeOverlay('ovHeritage'); if(G.planet!==pid||G.mode!=='map') enterMap(pid); const q=ll2xy(best.lat,best.lon); G.target={x:q.x,y:q.y}; G.targetRelic=best; }; } else pill.textContent=''; };
  HM.alive=false; const me={alive:true}; HM=me;
  const loop=ts=>{ if(!me.alive||!$('#ovHeritage').classList.contains('open')) return; c.setTransform(d,0,0,d,0,0); c.drawImage(TERRAIN[pid].texCanvas,0,0,w,h); c.fillStyle='rgba(6,10,26,.45)'; c.fillRect(0,0,w,h);
   c.save(); c.globalCompositeOperation='lighter';
   for(const r of relicsOf(pid)){ const px=(r.lon+180)/360*w, py=(90-r.lat)/180*h; let k=1; const isIgn=ign&&ign.id===r.id;
    if(isIgn) k=clamp((ts-t0-300)/1600,0,1);
    if(isDone(r.id)){ const e=1-Math.pow(1-k,3); const rr=(w*.05)*(1+.12*Math.sin(ts/450+px))*e+.01; const g=c.createRadialGradient(px,py,0,px,py,rr); g.addColorStop(0,'rgba(255,232,170,1)'); g.addColorStop(.25,'rgba(244,182,63,.6)'); g.addColorStop(1,'rgba(244,140,40,0)'); c.fillStyle=g; c.beginPath(); c.arc(px,py,rr,0,TAU); c.fill();
     if(isIgn&&k<1){ for(let i=0;i<3;i++){ const kk=clamp(k*1.4-i*.2,0,1); c.strokeStyle=`rgba(255,215,130,${(1-kk)*.9})`; c.lineWidth=2; c.beginPath(); c.arc(px,py,kk*w*.18,0,TAU); c.stroke(); } }
    } else { c.fillStyle='rgba(150,215,232,.55)'; c.beginPath(); c.arc(px,py,2.5,0,TAU); c.fill(); }
    if(sel===r){ c.strokeStyle='rgba(95,208,230,.95)'; c.lineWidth=1.5; c.beginPath(); c.arc(px,py,9,0,TAU); c.stroke(); } }
   c.restore();
   c.font='600 11px "Chakra Petch",sans-serif'; c.textAlign='left';
   for(const r of relicsOf(pid)){ if(!isDone(r.id)) continue; if(ign&&ign.id===r.id&&ts-t0<900) continue; const px=(r.lon+180)/360*w, py=(90-r.lat)/180*h; if(w<520&&!(ign&&ign.id===r.id)&&sel!==r) continue; c.fillStyle='rgba(0,0,0,.5)'; c.fillText(r.name.split(' –')[0],px+9,py+4); c.fillStyle='#ffe2a0'; c.fillText(r.name.split(' –')[0],px+8,py+3); }
   requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
 };
 draw();
}

// ===== LOGBOOK =====
function openLog(){ const b=$('#logBody');
 b.innerHTML=['moon','mars','deep'].map(p=>`<h3>${pName(p)} <span class="num">${doneCount(p)}/${relicsOf(p).length}</span></h3><ul class="loglist">${relicsOf(p).map(r=>`<li><button class="logrow ${isDone(r.id)?'ok':''}" data-id="${r.id}"><i></i><span><b>${esc(r.name)}</b><small>${esc(L(r.site))} · ${fmtDate(r.date).slice(-4)}</small></span><em>${t(isDone(r.id)?'restoredTag':'waitingTag')}</em></button></li>`).join('')}</ul>`).join('')
 + `<div class="actions"><button class="btn ghost" id="resetBtn">${t('reset')}</button><button class="btn primary" data-close="ovLog">${t('close')}</button></div>`;
 b.querySelectorAll('.logrow').forEach(el=>el.onclick=()=>{ sfx.tap(); const r=RELICS.find(x=>x.id===el.dataset.id); closeOverlay('ovLog'); openOverlay('ovRelic'); showDossier(r,true); });
 $('#resetBtn').onclick=()=>{ if(confirm(t('resetQ'))){ S.restored=[]; S.pos={}; S.planet=null; S.tut=false; save(); location.hash=''; location.reload(); } };
 openOverlay('ovLog'); }
function openSources(){ $('#srcBody').innerHTML=`<p>${t('srcP')}</p><ul class="src">${SOURCES.map(s=>`<li><b>${esc(s[0])}</b><span class="num">${esc(s[1])}</span></li>`).join('')}</ul><p class="hint">${t('srcNote')}</p><div class="actions"><button class="btn primary" data-close="ovSources">${t('close')}</button></div>`; $('#srcTitle').textContent=t('srcT'); openOverlay('ovSources'); }
function openFinal(){ G.mode='final'; show('scrFinal'); $('#finalP').textContent=t('finalP',{n:RELICS.length}); }
$('#btnReplay').onclick=()=>{ S.restored=[]; S.pos={}; S.planet=null; save(); location.reload(); };
$('#btnFinalMap').onclick=()=>{ openHeritage({planet:'moon'}); };
$('#btnFinalBack').onclick=()=>{ goPlanets(); };

document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const o=[...document.querySelectorAll('.overlay.open')].pop(); if(o) closeOverlay(o.id); } });

window.__back=()=>{ const o=[...document.querySelectorAll('.overlay.open')].pop(); if(o){ closeOverlay(o.id); return true; }
 if(G.mode==='map'){ S.pos[G.planet]={x:G.robot.x,y:G.robot.y}; save(); goPlanets(); return true; }
 if(G.mode==='planets'||G.mode==='final'){ G.mode='title'; show('scrTitle'); applyLang(); return true; } return false; };
// ===== MAIN LOOP =====
let lastT=performance.now();
function frame(ts){ const dt=Math.min(.05,(ts-lastT)/1000); lastT=ts; G.time=ts;
 if(G.mode==='map'){ if(!document.querySelector('.overlay.open')) update(dt); render(ts); }
 else if(G.mode==='title'){ const g=globes[0]; if(g){ g.rot=reduceMotion?.15:Math.sin(ts/9000)*.75; g.draw(ts); } }
 else if(G.mode==='planets'){ for(const g of globes.slice(1)){ if(TERRAIN[g.pid]){ g.rot+=reduceMotion?0:dt*.12; g.draw(ts); } } }
 requestAnimationFrame(frame); }

// ===== BOOT =====
function boot(){
 resize(); syncSound(); applyLang();
 setTimeout(()=>{ genTerrain('moon'); globes[0]=makeGlobe($('#globeTitle'),'moon',{res:340,tilt:6,rot:0});
  globes[1]=makeGlobe($('#globe-moon'),'moon',{res:220,tilt:8,rot:-.3});
  $('#loading').hidden=true; $('#btnStart').disabled=false;
  setTimeout(()=>{ genTerrain('mars'); globes[2]=makeGlobe($('#globe-mars'),'mars',{res:220,tilt:18,rot:1.2});
   setTimeout(()=>{ genTerrain('deep'); globes[3]=makeGlobe($('#globe-deep'),'deep',{res:220,tilt:20,rot:-1.4,flat:true}); },50); },50);
 },30);
 requestAnimationFrame(frame);
}
boot();

})();
