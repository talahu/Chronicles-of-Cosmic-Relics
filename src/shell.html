<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1c">
<title>Chronicles of Cosmic Relics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
 --space:#070b1c; --space-2:#10173a;
 --panel:#eef1f7; --panel-2:#e1e6f0; --ink:#151c33; --muted:#56607a; --line:rgba(21,28,51,.16);
 --beacon:#f4b63f; --beacon-ink:#8a5800; --signal:#0d7891; --signal-bright:#5fd0e6;
 --ok:#1b7d52; --bad:#b8352a; --wire-on:#2bb7d6; --wire-off:#b9c0cf; --gate:#ffffff;
 --hud:rgba(8,12,30,.74); --hud-ink:#e8ecf6; --hud-muted:#a3adc6;
 --f-display:"Chakra Petch","Be Vietnam Pro",system-ui,sans-serif;
 --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 color-scheme:light;
 box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
 --panel:#141a33; --panel-2:#1c2445; --ink:#e8ecf6; --muted:#a3adc6; --line:rgba(232,236,246,.14);
 --beacon-ink:#f4c364; --signal:#5fd0e6; --ok:#4cc38a; --bad:#ff8172; --wire-on:#5fd0e6; --wire-off:#3a4366; --gate:#1c2445; color-scheme:dark; } }
:root[data-theme="dark"]{ --panel:#141a33; --panel-2:#1c2445; --ink:#e8ecf6; --muted:#a3adc6; --line:rgba(232,236,246,.14);
 --beacon-ink:#f4c364; --signal:#5fd0e6; --ok:#4cc38a; --bad:#ff8172; --wire-on:#5fd0e6; --wire-off:#3a4366; --gate:#1c2445; color-scheme:dark; }
html{height:100%;background:var(--space);scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--space);color:var(--hud-ink);font:400 16px/1.55 var(--f-body);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--signal-bright);outline-offset:2px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
#app{position:relative;width:100%;height:100%;overflow:hidden}
#stars{position:absolute;inset:0;width:100%;height:100%}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:flex}

/* buttons */
.btn{border:1px solid var(--line);background:transparent;border-radius:12px;padding:.7em 1.15em;font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.01em;color:var(--ink);min-height:44px;transition:transform .12s,background .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--beacon);border-color:var(--beacon);color:#231500}
.btn.primary:hover{background:#ffc75c}
.btn.ghost{color:var(--muted)}
.btn.sm{min-height:34px;padding:.35em .8em;font-size:.88rem}
.btn.round{width:48px;height:48px;padding:0;border-radius:50%;flex:none}
.btn.glow{box-shadow:0 0 0 0 rgba(244,182,63,.7);animation:ring 1.8s infinite}
@keyframes ring{70%{box-shadow:0 0 0 14px rgba(244,182,63,0)}100%{box-shadow:0 0 0 0 rgba(244,182,63,0)}}
.hudbtn{border:1px solid rgba(255,255,255,.14);background:var(--hud);color:var(--hud-ink);border-radius:12px;min-height:42px;min-width:42px;padding:0 .8em;font-family:var(--f-display);font-weight:600;font-size:.9rem;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hudbtn.muted{color:var(--hud-muted);text-decoration:line-through}

/* title */
#scrTitle{align-items:center;justify-content:center;padding:24px clamp(20px,5vw,72px);gap:clamp(16px,4vw,64px)}
.ttext{max-width:34rem;position:relative;z-index:1}
.kicker{font-family:var(--f-display);font-weight:500;color:var(--hud-muted);font-size:.9rem;margin:0 0 1.2rem}
h1.title{font-family:var(--f-display);font-weight:700;font-size:clamp(2.4rem,6.4vw,4.6rem);line-height:.92;letter-spacing:-.02em;margin:0;color:#fff}
h1.title span{display:block}
h1.title span:last-child{color:transparent;-webkit-text-stroke:1.2px #ffe0a0;text-shadow:0 0 28px rgba(244,182,63,.35)}
.sub{font-family:var(--f-display);font-weight:500;font-size:clamp(1.05rem,2.2vw,1.35rem);color:#ffd987;margin:.9rem 0 1.1rem}
.story{color:#c9d0e2;max-width:32rem;margin:0 0 1.6rem;font-size:1rem}
.trow{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.trow .btn:not(.primary){color:var(--hud-ink);border-color:rgba(255,255,255,.2)}
#loading{color:var(--hud-muted);font-size:.9rem;margin-top:.8rem}
.globe-wrap{position:relative;flex:none;width:min(46vh,40vw,420px);aspect-ratio:1}
.globe-wrap canvas{width:100%;height:100%;display:block;border-radius:50%;filter:drop-shadow(0 0 40px rgba(120,150,255,.12))}
.tcorner{position:absolute;top:12px;right:12px;display:flex;gap:8px;z-index:2}
@media (max-width:760px){ #scrTitle{flex-direction:column;justify-content:flex-start;overflow:auto;padding-top:56px} .globe-wrap{width:min(58vw,260px)} .ttext{text-align:left} }
@media (max-height:500px) and (orientation:landscape){ .globe-wrap{width:min(70vh,260px)} h1.title{font-size:2.2rem} .kicker{padding-right:100px;margin-bottom:.6rem} .story{font-size:.9rem;margin-bottom:1rem} #scrTitle{padding-top:12px} }

/* planets */
#scrPlanets{flex-direction:column;align-items:center;justify-content:safe center;padding:20px;gap:18px;overflow:auto}
#scrPlanets h2{font-family:var(--f-display);font-weight:600;font-size:clamp(1.4rem,3vw,2rem);margin:0;color:#fff}
.pcards{display:flex;gap:clamp(12px,3vw,40px);flex-wrap:wrap;justify-content:center;width:100%;max-width:1200px}
.pcard{flex:1 1 240px;max-width:360px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:.6rem;padding:8px}
.pcard canvas{width:min(200px,42vw);aspect-ratio:1;border-radius:50%}
.pcard h3{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:.2rem 0 0;color:#fff}
.pcard p{margin:0;color:#c9d0e2;font-size:.95rem;max-width:30ch}
.pc-bar{width:180px;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.pc-bar i{display:block;height:100%;background:var(--beacon);width:0;transition:width .6s}
.pc-prog{font-family:var(--f-display);color:#ffd987;font-size:.9rem}
@media (max-height:520px){ .pcard canvas{width:120px} .pcard p{display:none} }

/* map */
#scrMap{display:none}
#scrMap.on{display:block}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}
.hudtop{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.hudtop>*{pointer-events:auto}
#coord{font-family:var(--f-display);font-weight:500;background:var(--hud);border-radius:12px;padding:.55em .9em;font-size:.92rem;color:#bfeaf4;border:1px solid rgba(95,208,230,.25);min-height:42px;display:flex;align-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.spacer{flex:1}
#planetChip{color:#ffd987}
.scanner{position:absolute;left:10px;bottom:12px;background:var(--hud);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:.7em .9em;display:flex;gap:.8em;align-items:center;max-width:min(340px,calc(100% - 20px));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:none}
.compass{width:44px;height:44px;border-radius:50%;border:1px solid rgba(95,208,230,.4);display:grid;place-items:center;flex:none}
#arrow{width:26px;height:26px;transition:transform .15s linear}
.scanner small{display:block;color:var(--hud-muted);font-size:.78rem}
#nearName{font-family:var(--f-display);font-weight:600;font-size:1rem;display:block;line-height:1.2}
#nearDist{color:#bfeaf4;font-size:.85rem}
#prog{font-family:var(--f-display);color:#ffd987;font-size:.8rem;display:block;margin-top:.2rem}
#interact{position:absolute;left:50%;bottom:max(14px,calc(12px));transform:translateX(-50%);z-index:3;box-shadow:0 8px 30px rgba(0,0,0,.4)}
#interact.done{background:var(--panel);color:var(--ink);border-color:var(--panel)}
@media (max-width:640px){ #toast{top:112px} #btnSources{display:none} #interact{bottom:96px;max-width:calc(100% - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} #coord{font-size:.8rem;order:9;flex-basis:auto} }
#toast{position:absolute;left:50%;top:64px;transform:translate(-50%,-10px);background:var(--panel);color:var(--ink);padding:.75em 1.1em;border-radius:12px;max-width:min(460px,calc(100% - 24px));font-size:.95rem;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* overlays */
.overlay{position:absolute;inset:0;z-index:30;background:rgba(3,6,16,.66);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:12px}
.overlay.open{display:flex}
.sheet{background:var(--panel);color:var(--ink);width:min(760px,100%);max-height:100%;overflow:auto;border-radius:20px;padding:clamp(16px,3vw,28px);position:relative;-webkit-user-select:text;user-select:text;box-shadow:0 30px 80px rgba(0,0,0,.5);overscroll-behavior:contain}
.sheet.wide{width:min(980px,100%)}
.x{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:0;background:var(--panel-2);color:var(--ink);font-size:1.2rem;line-height:1;z-index:2}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:clamp(1.5rem,3.5vw,2rem);line-height:1.1;margin:.1rem 0 .4rem}
.sheet h3{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:1.1rem 0 .5rem}
.hint{color:var(--muted);font-size:.93rem;margin:.2rem 0 .8rem}
.actions{display:flex;gap:.6rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1.2rem;align-items:center}
.log{background:#0a1028;color:#d8def0;border-radius:14px;padding:.9em 1em;font-size:.95rem;margin:0 0 1rem;cursor:pointer;min-height:3em}
.ln{margin:.25em 0 .55em}
.ln b{font-family:var(--f-display);font-weight:600;font-size:.78rem;margin-right:.6em;padding:.12em .5em;border-radius:6px;background:rgba(255,255,255,.08);color:#a3adc6}
.ln.robot b{color:#7fe0f2;background:rgba(95,208,230,.12)} .ln.robot span{color:#bfeaf4}
.ln.relic b{color:#ffd987;background:rgba(244,182,63,.14)} .ln.relic span{color:#ffe7b5;font-style:italic}
.ln.alert b{color:#ffb4a8;background:rgba(255,120,100,.14)}
.ln.ok b{color:#9ff0c6;background:rgba(76,195,138,.15)} .ln.ok span{color:#d7f8e6}
.ln.note{font-size:.84rem;color:#a3adc6;border-left:2px solid rgba(244,182,63,.5);padding-left:.8em}
.dossier{display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:18px;align-items:start;margin-top:.2rem}
.dossier .art{width:100%;height:auto;border-radius:14px;display:block}
.art.sm{width:160px;border-radius:12px;display:block}
.dlg-head{display:flex;justify-content:center;margin-bottom:.8rem}
.tag{display:inline-block;font-family:var(--f-display);font-weight:600;font-size:.8rem;margin:0;color:var(--muted)}
.tag.ok{color:var(--beacon-ink)}
.mission{margin:0 0 .6rem;color:var(--ink)}
dl{display:grid;grid-template-columns:auto 1fr;gap:.25rem .9rem;margin:0;font-size:.92rem}
dt{color:var(--muted)} dd{margin:0}
.facts{margin:0;padding-left:1.1em} .facts li{margin:.35em 0}
@media (max-width:600px){ .dossier{grid-template-columns:1fr} .dossier .art{max-width:300px} }
.meter{display:flex;align-items:center;gap:.7em;flex:1;font-size:.88rem;color:var(--muted)}
.meter .bar{flex:1;height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden;min-width:60px}
.meter .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--signal-bright),var(--beacon));transition:width .15s}
.meter b{color:var(--ink);min-width:3ch;text-align:right}
.dustwrap{position:relative;width:100%;border-radius:14px;overflow:hidden;margin-bottom:.8rem;touch-action:none}
.dustwrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.dlayer{cursor:grab}
.dlabel{position:absolute;left:10px;bottom:8px;font-family:var(--f-display);font-size:.75rem;color:rgba(255,255,255,.75);pointer-events:none;text-shadow:0 1px 2px #000}
.antwrap{width:100%;border-radius:14px;overflow:hidden;touch-action:none}
.ant{width:100%;display:block;touch-action:none;cursor:grab}
.antctl{display:flex;align-items:center;gap:.8em;margin-top:.8rem}
.amsg,.cmsg,.qmsg{min-height:1.4em;font-family:var(--f-display);color:var(--signal);margin:.6rem 0 0}
.legend{margin:0 0 .6rem;padding-left:1.1em;font-size:.88rem;color:var(--muted)}
.circ svg{width:100%;height:auto;display:block;max-height:52vh}
.circ .w{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;transition:stroke .2s}
.sw{cursor:pointer} .sw rect{fill:var(--panel-2);stroke:var(--line);stroke-width:1.5} .sw circle{fill:#9aa4bf;transition:cx .15s} .sw text{font-family:var(--f-display);font-weight:700;font-size:15px;text-anchor:middle;fill:var(--muted)}
.sw.on rect{fill:rgba(95,208,230,.22);stroke:var(--wire-on)} .sw.on circle{fill:var(--wire-on)}
.sw:focus-visible rect{stroke:var(--beacon);stroke-width:3}
.gate rect{fill:var(--gate);stroke:var(--wire-off);stroke-width:2} .gate text{font-family:var(--f-display);font-weight:700;font-size:15px;text-anchor:middle;fill:var(--ink)}
.gate.on rect{stroke:var(--wire-on)}
.not rect{fill:var(--gate);stroke:var(--muted);stroke-width:1.2} .not text{font-family:var(--f-display);font-size:10px;font-weight:700;text-anchor:middle;fill:var(--muted)}
.lamp{fill:var(--wire-off);transition:fill .3s} .lamp.on{fill:var(--beacon);filter:drop-shadow(0 0 8px var(--beacon))}
.olabel{font-family:var(--f-display);font-size:11px;text-anchor:middle;fill:var(--muted)}
.qq{font-weight:600;font-size:1.08rem;margin:.4rem 0 .8rem}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.55rem}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--panel-2);color:var(--ink);border-radius:12px;padding:.75em 1em;min-height:48px;font-size:.98rem}
.opt:hover:not(:disabled){border-color:var(--signal)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--panel));color:var(--ink)}
.opt.wrong{border-color:var(--bad);opacity:.6;text-decoration:line-through}
.opt:disabled{cursor:default}
.qex p{background:var(--panel-2);border-radius:12px;padding:.8em 1em;margin:.6rem 0 0}
.tabs{display:flex;gap:.5rem;margin:0 0 .9rem;padding-right:46px}
.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:.45em 1em;font-family:var(--f-display);font-weight:600;color:var(--muted);min-height:40px}
.tab.on{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.hmwrap{width:100%;border-radius:14px;overflow:hidden;background:#000}
.hm{width:100%;display:block;cursor:pointer}
.hpill{min-height:1.6em;margin:.7rem 0 0;display:flex;gap:.5em;align-items:center;flex-wrap:wrap;font-size:.93rem}
.hpill span{color:var(--muted)} .hpill em{font-style:normal;font-family:var(--f-display);font-size:.82rem;color:var(--muted)} .hpill em.ok{color:var(--beacon-ink)}
.ign{font-family:var(--f-display);font-weight:600;font-size:1.15rem;margin:.6rem 0 .2rem;color:var(--beacon-ink)}
.meaning{color:var(--muted);margin:.2rem 0 0;max-width:60ch}
.pdone{margin:0 auto 0 0;font-family:var(--f-display);font-weight:600;color:var(--ok)}
.loglist{list-style:none;margin:0;padding:0;display:grid;gap:.4rem}
.logrow{width:100%;display:flex;gap:.8em;align-items:center;text-align:left;background:var(--panel-2);border:1px solid transparent;border-radius:12px;padding:.6em .9em;color:var(--ink)}
.logrow:hover{border-color:var(--line)}
.logrow i{width:10px;height:10px;border-radius:50%;background:var(--wire-off);flex:none}
.logrow.ok i{background:var(--beacon);box-shadow:0 0 8px var(--beacon)}
.logrow span{flex:1;min-width:0} .logrow b{display:block;font-weight:600} .logrow small{color:var(--muted)}
.logrow em{font-style:normal;font-family:var(--f-display);font-size:.8rem;color:var(--muted);white-space:nowrap} .logrow.ok em{color:var(--beacon-ink)}
.src{padding-left:1.1em} .src li{margin:.4em 0} .src span{display:block;color:var(--muted);font-size:.88rem}
/* final */
#scrFinal{flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:1rem}
#scrFinal h2{font-family:var(--f-display);font-weight:700;font-size:clamp(2.2rem,6vw,4rem);margin:0;color:transparent;-webkit-text-stroke:1.2px #ffe0a0;text-shadow:0 0 30px rgba(244,182,63,.45)}
#scrFinal p{max-width:40rem;color:#c9d0e2}
#scrFinal .btn:not(.primary){color:var(--hud-ink);border-color:rgba(255,255,255,.2)}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
</style>
</head>
<body>
<div id="app">
 <canvas id="stars" aria-hidden="true"></canvas>

 <section class="screen on" id="scrTitle" aria-label="Chronicles of Cosmic Relics">
  <div class="tcorner"><button class="hudbtn" id="langBtn" data-tt="lang">EN</button><button class="hudbtn" id="soundBtn" data-tt="sound" aria-pressed="true">♪</button></div>
  <div class="globe-wrap"><canvas id="globeTitle" aria-hidden="true"></canvas></div>
  <div class="ttext">
   <p class="kicker" data-t="challenge"></p>
   <h1 class="title"><span>Chronicles of</span><span>Cosmic Relics</span></h1>
   <p class="sub" data-t="subtitle"></p>
   <p class="story" data-t="story"></p>
   <div class="trow"><button class="btn primary" id="btnStart" disabled>…</button><button class="btn" id="btnSourcesTitle" data-t="sources"></button></div>
   <p id="loading">…</p>
  </div>
 </section>

 <section class="screen" id="scrPlanets">
  <h2 data-t="choose"></h2>
  <div class="pcards">
   <div class="pcard" id="pc-moon"><canvas id="globe-moon" aria-hidden="true"></canvas><h3 data-t="moon"></h3><p data-t="moonDesc"></p><span class="pc-prog"></span><div class="pc-bar"><i></i></div><button class="btn primary pc-go" data-p="moon"></button></div>
   <div class="pcard" id="pc-mars"><canvas id="globe-mars" aria-hidden="true"></canvas><h3 data-t="mars"></h3><p data-t="marsDesc"></p><span class="pc-prog"></span><div class="pc-bar"><i></i></div><button class="btn primary pc-go" data-p="mars"></button></div>
   <div class="pcard" id="pc-deep"><canvas id="globe-deep" aria-hidden="true"></canvas><h3 data-t="deep"></h3><p data-t="deepDesc"></p><span class="pc-prog"></span><div class="pc-bar"><i></i></div><button class="btn primary pc-go" data-p="deep"></button></div>
  </div>
  <button class="btn" id="btnBack" data-t="back" style="color:var(--hud-ink);border-color:rgba(255,255,255,.2)"></button>
 </section>

 <section class="screen" id="scrMap">
  <canvas id="map" aria-label="Map"></canvas>
  <div class="hudtop">
   <button class="hudbtn" id="planetChip" data-tt="planetSwitch">—</button>
   <div id="coord" aria-live="off">0.00°N, 0.00°E</div>
   <span class="spacer"></span>
   <button class="hudbtn" id="btnHeritage" data-t="heritage"></button>
   <button class="hudbtn" id="btnLog" data-t="log"></button>
   <button class="hudbtn" id="langBtn2" data-tt="lang">EN</button>
   <button class="hudbtn" id="btnSources" data-tt="sources">i</button>
  </div>
  <div class="scanner"><div class="compass"><svg id="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h15M13 6l6 6-6 6" fill="none" stroke="#5fd0e6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
   <div><small id="nearLabel"></small><span id="nearName"></span><span id="nearDist"></span><span id="prog"></span></div></div>
  <button class="btn primary" id="interact" hidden></button>
 </section>

 <section class="screen" id="scrFinal">
